services:

  # === Kafka ===
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: media-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: media-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # === MinIO (Object Storage) ===
  minio:
    image: minio/minio:latest
    container_name: media-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-mc:
    image: minio/mc:latest
    container_name: media-minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting...' && sleep 1; done;
      /usr/bin/mc mb myminio/media || true;
      /usr/bin/mc anonymous set public myminio/media || true;
      exit 0;
      "

  # === Media Service (pull từ GHCR) ===
  media-service:
    image: ghcr.io/phamthanhlong100504-xpnd/media-service:latest
    container_name: media-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - minio
    environment:
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS-KEY: minioadmin
      MINIO_SECRET-KEY: minioadmin

volumes:
  minio_data:
