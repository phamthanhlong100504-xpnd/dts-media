name: Build & Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/media-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx512m"
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "build/test-results/**/*.xml"

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-test-report
          path: build/reports/tests/test/
          retention-days: 7

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE:latest \
            -t $IMAGE:${{ github.sha }} .

      - name: Push latest
        run: docker push $IMAGE:latest

      - name: Push commit tag
        run: docker push $IMAGE:${{ github.sha }}

      - name: Build MinIO Image from Source
        run: |
          mkdir -p minio-build
          cat << 'EOF' > minio-build/Dockerfile
          FROM golang:alpine as builder
          RUN apk add --no-cache git
          RUN go install github.com/minio/minio@latest
          
          FROM alpine:latest
          RUN apk add --no-cache ca-certificates tzdata
          COPY --from=builder /go/bin/minio /usr/local/bin/minio
          CMD ["minio", "server", "/data", "--console-address", ":9001"]
          EOF
          docker build -t my-minio:latest ./minio-build
          docker save my-minio:latest -o minio.tar
          sudo chmod 777 minio.tar
          
      - name: Prepare VPS Directory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /dts/media

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "docker-compose.prod.yml,minio.tar"
          target: "/dts/media/"

      - name: Deploy VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: JWT_ACCESS_SECRET
          script: |
            set -e
            docker network create dts-network || true
            cd /dts/media
            mv -f docker-compose.prod.yml docker-compose.yml
            
            # Load MinIO image directly from tarball! No compilation, no rate limits!
            docker load -i minio.tar
            rm -f minio.tar
            
            # Inject JWT secret: from GitHub Secret or directly from dts-identity-service on VPS 1
            if [ -n "$JWT_ACCESS_SECRET" ]; then
              echo "JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET" > .env
            else
              IDENTITY_SECRET=$(docker exec dts-identity-service printenv JWT_ACCESS_SECRET 2>/dev/null || true)
              if [ -n "$IDENTITY_SECRET" ]; then
                echo "JWT_ACCESS_SECRET=$IDENTITY_SECRET" > .env
                echo "Successfully copied JWT_ACCESS_SECRET from dts-identity-service container"
              elif [ -f /dts/identity/.env ]; then
                JWT_SECRET=$(grep "^JWT_ACCESS_SECRET=" /dts/identity/.env | head -n 1 | cut -d '=' -f2-)
                if [ -n "$JWT_SECRET" ]; then
                  echo "JWT_ACCESS_SECRET=$JWT_SECRET" > .env
                  echo "Successfully copied JWT_ACCESS_SECRET from /dts/identity/.env"
                fi
              fi
            fi
            
            # Login to GHCR to pull our private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull media-service
            
            # Pull other third-party images
            docker logout ghcr.io || true
            docker compose pull zookeeper kafka || true
            
            # Start all services and force recreate media-service to apply new env
            docker compose up -d --force-recreate media-service
            echo "=== MEDIA-SERVICE LOGS ==="
            docker logs media-service --tail 50 || true
            docker image prune -a -f
