name: Media Diagnostics VPS 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Test MinIO with mc
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== INSTALL MC ==="
            if [ ! -f /usr/local/bin/mc ]; then
              curl -s https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc || wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
              chmod +x /usr/local/bin/mc
            fi
            
            echo "=== CONFIGURE MC ALIAS ==="
            /usr/local/bin/mc alias set local http://localhost:9000 minioadmin minioadmin 2>&1
            
            echo "=== MC LS ==="
            /usr/local/bin/mc ls local/media/uploads/2026/10/31/ 2>&1 | head -n 5
            
            echo "=== MC SHARE DOWNLOAD ==="
            SHARE_URL=$(/usr/local/bin/mc share download --expire 5m local/media/uploads/2026/10/31/0cce6c10-def0-4873-a179-046080d84aee.webp 2>&1 | grep "http" | head -n 1)
            echo "Generated share url: $SHARE_URL"
            
            echo "=== CURL MC SHARE URL ==="
            curl -s -I "$SHARE_URL" 2>&1
