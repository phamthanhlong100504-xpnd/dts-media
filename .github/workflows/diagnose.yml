name: Media Diagnostics VPS 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect MinIO Credentials
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "=== MEDIA-MINIO ENV ==="
            docker exec media-minio env | grep -i minio
            echo "=== MEDIA-SERVICE ENV ==="
            docker exec media-service env | grep -i minio
            echo "=== TEST DIRECT GET OBJECT ==="
            docker exec media-service python3 -c "print('test')" 2>&1 || true
